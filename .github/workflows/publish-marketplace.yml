name: Publicar VSIX en Marketplace

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de GitHub Release que contiene el VSIX universal (ej. v2.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publicar paquete universal
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Descargar VSIX de la Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          mkdir -p packages
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --dir packages \
            --pattern "DevFlow-Scanner-2.*.vsix"
          test "$(find packages -maxdepth 1 -name '*.vsix' | wc -l)" -eq 1

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publicar DevFlow universal
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --skip-duplicate --packagePath "$(find packages -name 'DevFlow-Scanner-2.*.vsix' -print -quit)"
